name: Desktop-App bauen (Windows + Mac)

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'web/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installiert Electron und baut das NDI-Modul (lädt das NDI-SDK automatisch)
      - run: npm ci

      - name: NDI-Modul prüfen
        run: node -e "const g=require('@stagetimerio/grandiose');console.log('NDI ok, RGBA=',g.FOURCC_RGBA)"

      - name: Version lesen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Installer bauen
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: CueStack-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CueStack ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
