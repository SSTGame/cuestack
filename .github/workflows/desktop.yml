name: Desktop-App bauen (Windows + Mac)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installiert Electron und baut das NDI-Modul (lädt das NDI-SDK automatisch)
      - run: npm ci

      - name: NDI-Modul prüfen
        run: node -e "const g=require('@stagetimerio/grandiose');console.log('NDI ok, RGBA=',g.FOURCC_RGBA)"

      - name: Installer bauen
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: CueStack-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CueStack ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
